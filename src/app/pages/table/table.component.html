<div class="container mt-5">

  <div class="card shadow-sm border-0">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h4 class="mb-0 text-primary fw-semibold">Table des Utilisateurs</h4>

      <div class="d-flex gap-3 align-items-center">
        <!-- Champ de recherche -->
        <mat-form-field appearance="outline" floatLabel="always" class="mb-0" style="width: 300px;height:10px">
          <mat-label>Rechercher par ID</mat-label>
          <input matInput [(ngModel)]="searchId" placeholder="Entrez l'ID" (input)="applyFilter()">
        </mat-form-field>

        <!-- Bouton Ajouter -->
        <button mat-flat-button color="primary" (click)="addUser()">
          <i class="bi bi-person-plus me-2"></i> Ajouter
        </button>
      </div>
    </div>

    <div class="card-body">
      <!-- Table d'utilisateurs -->
      <table *ngIf="dataSource.data.length > 0" mat-table [dataSource]="dataSource" class="mat-elevation-z2 w-100">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let user"> {{ user.id }} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nom </th>
          <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
        </ng-container>

        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef> Département </th>
          <td mat-cell *matCellDef="let user"> {{ user.department }} </td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef> Rôle </th>
          <td mat-cell *matCellDef="let user"> {{ user.role }} </td>
        </ng-container>

        <ng-container matColumnDef="password">
          <th mat-header-cell *matHeaderCellDef> Mot de passe </th>
          <td mat-cell *matCellDef="let user"> {{ user.password }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button color="primary" (click)="editUser(user)" matTooltip="Modifier">
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button mat-icon-button color="warn" (click)="deleteUser(user.id)" matTooltip="Supprimer">
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Pagination -->
      <div class="mt-3">
        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
      </div>

      <!-- Alerte aucun utilisateur -->
      <div *ngIf="dataSource.data.length === 0" class="alert alert-warning text-center mt-3" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i> Aucun utilisateur trouvé.
      </div>
    </div>

    <!-- Formulaire édition -->
    <div *ngIf="isEditing" class="border-top p-4 bg-light">
      <h5 class="text-primary fw-bold mb-4">Modifier un utilisateur</h5>

      <div class="row g-3">
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Nom</mat-label>
            <input matInput [(ngModel)]="selectedUser.name">
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="selectedUser.email">
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Mot de passe</mat-label>
            <input matInput [(ngModel)]="selectedUser.password" type="password">
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Département</mat-label>
            <input matInput [(ngModel)]="selectedUser.department">
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Rôle</mat-label>
            <input matInput [(ngModel)]="selectedUser.role">
          </mat-form-field>
        </div>
      </div>

      <div class="mt-3 d-flex gap-3">
        <button mat-flat-button color="primary" (click)="updateUser()">
          <i class="bi bi-check-circle me-1"></i> Enregistrer
        </button>
        <button mat-flat-button color="warn" (click)="cancelEdit()">
          <i class="bi bi-x-circle me-1"></i> Annuler
        </button>
      </div>
    </div>
  </div>
</div>
